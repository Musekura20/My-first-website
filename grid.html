<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        
.parent {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    height: 100vh;
    
}
    
.div1 {
    grid-row: span 5 / span 5;
    background-color: rgb(148, 183, 213);
    align-content: center;
    color: white;
    font-size: 30px;
    text-align: center;
    font-weight: 500;


}

.div2 {
    grid-column: span 4 / span 4;
    background-color: rgb(49, 73, 93);
    align-content: center;
    color: white;
    font-size: 30px;
    text-align: center;
    font-weight: 500;
}

.div3 {
    grid-column: span 3 / span 3;
    grid-row: span 3 / span 3;
    grid-column-start: 2;
    grid-row-start: 2;
    background-color: rgb(148, 183, 213);
    align-content: center;
    color: white;
    font-size: 30px;
    text-align: center;
    font-weight: 500;
}

.div8 {
    grid-row: span 3 / span 3;
    grid-column-start: 5;
    grid-row-start: 2;
    background-color: rgb(23, 42, 57);
    align-content: center;
    color: white;
    font-size: 30px;
    text-align: center;
    font-weight: 500;
}

.div9 {
    grid-column: span 2 / span 2;
    grid-column-start: 2;
    grid-row-start: 5;
    background-color: antiquewhite;
    align-content: center;
    color: rgb(19, 19, 19);
    font-size: 30px;
    text-align: center;
    font-weight: 500;
}

.div10 {
    grid-column: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 5;
    background-color: rgb(15, 35, 52);
    align-content: center;
    color: white;
    font-size: 30px;
    text-align: center;
    font-weight: 500;
}
        
    </style>
</head>
<body>

<div class="parent">
    <div class="div1">Side bar</div>
    <div class="div2">Navbar with Navigation</div>
    <div class="div3">Main content With content card</div>
    <div class="div8">history as  A list</div>
    <div class="div9">profile Picture List</div>
    <div class="div10">user Information</div>
</div>
    
</body>
</html>
