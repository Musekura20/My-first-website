<form action="/submit" method="POST" >
    <div>
        <label for="Full Name">Full Name: </label>
        <input type="text" name="Full Name" placeholder="Enter your full name........" required>
    </div>
    <br>
    <br>
    <div>
        <label for="Email">Email</label>
        <input type="email" name="Email" placeholder="Email...." required>
    </div>
    <br>
    </br>
    <div>
        <label for="Pone Number">Phone Number</label>
        <input type="tel" name="Phone Number" placeholder="Enter your phone number.......">
    </div>
    <br>
    <br>
    <div>
        <label for="Subject category">Subject category</label>
        <select name="Subject category">
            <option value="Select category">Select a subject category</option>
            <option>Customer support</option>
            <option>Sales Inquiry</option>
            <option>General Question</option>
        </select>
    </div>
    <br>
    <fieldset>
        <legend>Preferred Contact Method</legend>
        <input type="radio" id="contactEmail" name="contactMethod" value="email" checked>
        <label for="contactEmail">Email</label>
        <input type="radio" id="contactPhone" name="contactMethod" value="phone">
        <label for="contactPhone">Phone</label>
    </fieldset>
    <br>
    <br>
    <div>
        <label for="messageBody">Message:</label>
        <textarea id="messageBody" name="messageBody" rows="5" required></textarea>
    </div>
    <br>
    <br>
    <div>
        <button type="submit">Submit Form</button>
        <button type="reset">Reset form</button>
    </div>

</form>
